name: Aggiorna GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - app.html
      - src/**
      - public/**
      - package.json
      - package-lock.json
      - vite.config.ts
      - tsconfig.json
      - scripts/**
      - .github/workflows/pages.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Pubblica i file statici
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets favicon.svg .nojekyll
          git diff --cached --quiet || git commit -m "Aggiorna build GitHub Pages"
          git push
